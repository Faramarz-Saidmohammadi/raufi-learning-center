name: Repository Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          ADMIN_EMAILS: admin@example.com
          ADMIN_PASSWORD_HASH: pbkdf2-sha256$210000$placeholder$placeholder
          ADMIN_SESSION_SECRET: ci-placeholder-secret-that-is-at-least-32-characters
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_placeholder
          NEXT_PUBLIC_SITE_URL: https://example.com
